# Optional: PostgreSQL for local development.
# Run the app with:  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
services:
  db:
    image: postgres:16
    container_name: taskflow-db
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - taskflow-pgdata:/var/lib/postgresql/data

volumes:
  taskflow-pgdata:
