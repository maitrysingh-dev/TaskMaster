spring:
  application:
    name: taskflow-api
  datasource:
    # Default profile: file-based H2 so the project runs without any setup.
    url: jdbc:h2:file:./data/taskflow;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    # Override JWT_SECRET in any real deployment (must be at least 32 characters).
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-1234}
    expiration-ms: 86400000   # 24 hours
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
